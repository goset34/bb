[package]
name = "strata-native"
version = "0.1.0"
edition = "2021"
description = "STRATA native kernels (noise, pathfinding) compiled to WebAssembly with SIMD"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
